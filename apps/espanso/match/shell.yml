matches:

  - trigger: ":dstop"
    replace: "docker stop $(docker ps -a -q)"

  - trigger: ":drm"
    replace: "docker rm $(docker ps -a -q)"

  - trigger: ":dvol"
    replace: "docker volume rm $(docker volume ls -q)"

  - trigger: ":dprune"
    replace: "docker system prune -af --volumes"

  - trigger: ":dlog"
    replace: "docker logs -f --tail 100 $|$"

  - trigger: ":nlint"
    replace: "npm run lint --silent -- --fix"

  - trigger: ":ntc"
    replace: "npm run typecheck"

  - trigger: ":cx"
    replace: "claude --dangerously-skip-permissions"

  - trigger: ":cwd"
    replace: "pwd | pbcopy"

  - trigger: ":port"
    replace: "lsof -nP -iTCP:$|$ -sTCP:LISTEN"

  - trigger: ":szsh"
    replace: "source ~/.zshrc"
